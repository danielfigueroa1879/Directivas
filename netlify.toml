# netlify.toml

# Configuración base de construcción del sitio.
[build]
  # Le dice a Netlify dónde encontrar las funciones del servidor.
  functions = "netlify/functions/"

# Redirección específica y segura para nuestra API.
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini-proxy"
  status = 200
  force = true

# ============================================================
# CACHE HEADERS — assets estáticos con versión: 1 año
# ============================================================

# Imágenes: cache 1 año (inmutables, se reemplazan con nuevo nombre)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS con versión (?v=): 1 año
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JS con versión (?v=): 1 año
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rules / chatbot-rules.js
[[headers]]
  for = "/rules/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes y manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML principal: siempre revalidar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============================================================
# SECURITY HEADERS — Protección contra vulnerabilidades comunes
# ============================================================

# Headers de seguridad para TODAS las rutas
[[headers]]
  for = "/*"
  [headers.values]
    # Prevenir MIME type sniffing (XSS)
    X-Content-Type-Options = "nosniff"

    # Clickjacking protection
    X-Frame-Options = "DENY"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Referrer policy - evitar filtración de información
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Content Security Policy - CRÍTICA para prevenir inyecciones
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

    # Permisos de características del navegador
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Headers especiales para funciones Netlify (API endpoints)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"

# Redireccionar HTTP a HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
